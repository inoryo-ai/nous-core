<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>nous-core Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-bottom: 1px solid #334155;
    padding: 16px 24px;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.04em; }
  header .sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }

  .container {
    display: grid; grid-template-columns: 280px 1fr 320px; gap: 0;
    height: calc(100vh - 65px);
  }

  aside {
    background: #1e293b; border-right: 1px solid #334155;
    padding: 20px; overflow-y: auto;
  }
  aside h2 {
    font-size: 12px; color: #94a3b8; text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 12px;
  }
  .book-list { list-style: none; margin-bottom: 24px; }
  .book-item {
    padding: 8px 10px; background: #0f172a; border: 1px solid #334155;
    border-radius: 6px; margin-bottom: 6px; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .book-item .chk { accent-color: #3b82f6; }
  .book-item.empty { color: #64748b; font-style: italic; justify-content: center; }

  aside button, aside input, aside textarea {
    width: 100%; padding: 8px 10px; margin-bottom: 8px;
    background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
    border-radius: 6px; font-size: 13px; font-family: inherit;
  }
  aside button {
    background: #3b82f6; border: none; cursor: pointer; font-weight: 600;
    color: white;
  }
  aside button:hover { background: #2563eb; }
  aside textarea { min-height: 80px; resize: vertical; }

  main {
    display: flex; flex-direction: column;
    background: #0f172a;
  }
  #chat-log {
    flex: 1; overflow-y: auto; padding: 20px 28px;
  }
  .msg { margin-bottom: 16px; max-width: 72%; }
  .msg.user { margin-left: auto; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 12px; white-space: pre-wrap;
    font-size: 14px; line-height: 1.7;
  }
  .msg.user .bubble { background: #3b82f6; color: white; }
  .msg.ai .bubble { background: #1e293b; border: 1px solid #334155; }
  .msg.ai .bubble.fallback { border-color: #f59e0b; background: #1e1a0a; }
  .msg .meta {
    font-size: 10px; color: #64748b; margin-top: 4px;
    letter-spacing: 0.02em;
  }

  .chat-input {
    padding: 16px 28px; border-top: 1px solid #334155;
    background: #0f172a;
  }
  #input-row { display: flex; gap: 8px; }
  #input {
    flex: 1; padding: 12px 14px; border-radius: 8px;
    border: 1px solid #334155; background: #1e293b;
    color: #e2e8f0; font-size: 14px; font-family: inherit;
  }
  #send {
    padding: 12px 20px; border-radius: 8px; border: none;
    background: #3b82f6; color: white; font-weight: 600; cursor: pointer;
  }
  #send:hover { background: #2563eb; }

  #dashboard {
    background: #1e293b; border-left: 1px solid #334155;
    padding: 20px; overflow-y: auto;
  }
  #dashboard h2 {
    font-size: 12px; color: #94a3b8; text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 12px;
  }
  .stat {
    display: flex; justify-content: space-between; padding: 8px 0;
    border-bottom: 1px solid #334155; font-size: 13px;
  }
  .stat .label { color: #94a3b8; }
  .stat .value { color: #e2e8f0; font-weight: 600; }
  .trace {
    margin-top: 16px; padding: 12px; background: #0f172a;
    border-radius: 6px; font-family: ui-monospace, monospace;
    font-size: 11px; color: #94a3b8; white-space: pre-wrap;
    border: 1px solid #334155;
  }

  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 99px;
    font-size: 10px; background: #334155; color: #e2e8f0; margin-right: 4px;
  }
  .pill.intent-ask { background: #1e40af; }
  .pill.intent-solve { background: #854d0e; }
  .pill.intent-create { background: #166534; }
  .pill.intent-learn { background: #6b21a8; }
  .pill.fallback { background: #92400e; }

  details summary { cursor: pointer; color: #94a3b8; font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>NOUS-CORE <span style="color:#64748b">/</span> Demo Console</h1>
  <div class="sub">LLM-free cognitive engine &middot; prototype</div>
</header>

<div class="container">

  <aside>
    <h2>Books</h2>
    <ul id="book-list" class="book-list"><li class="book-item empty">loading...</li></ul>

    <h2>Add Book</h2>
    <input id="new-name" placeholder="book name" />
    <textarea id="new-content" placeholder='{"key": {"field": "value"}}'></textarea>
    <button onclick="addBook()">Register book</button>

    <h2 style="margin-top:20px">Conversation</h2>
    <button onclick="clearChat()" style="background:#7f1d1d">Clear history</button>
  </aside>

  <main>
    <div id="chat-log"></div>
    <div class="chat-input">
      <div id="input-row">
        <input id="input" placeholder="質問を入力… (Enter to send)" autocomplete="off" />
        <button id="send" onclick="sendQuestion()">Send</button>
      </div>
    </div>
  </main>

  <aside id="dashboard">
    <h2>Status</h2>
    <div class="stat"><span class="label">Books</span><span id="stat-books" class="value">0</span></div>
    <div class="stat"><span class="label">Patterns</span><span id="stat-patterns" class="value">0</span></div>
    <div class="stat"><span class="label">Facts</span><span id="stat-facts" class="value">0</span></div>
    <div class="stat"><span class="label">Turns</span><span id="stat-turns" class="value">0</span></div>

    <h2 style="margin-top:20px">Last Trace</h2>
    <div id="trace" class="trace">(no query yet)</div>
  </aside>

</div>

<script>
const API = "";

function clearChildren(el) { while (el.firstChild) el.removeChild(el.firstChild); }

async function loadBooks() {
  const r = await fetch(`${API}/books`);
  const books = await r.json();
  const ul = document.getElementById("book-list");
  clearChildren(ul);
  if (!books.length) {
    const li = document.createElement("li");
    li.className = "book-item empty";
    li.textContent = "no books loaded";
    ul.appendChild(li);
    return;
  }
  books.forEach(b => {
    const li = document.createElement("li");
    li.className = "book-item";
    const span = document.createElement("span");
    span.textContent = b.name;
    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.className = "chk";
    chk.dataset.name = b.name;
    chk.checked = true;
    li.appendChild(span);
    li.appendChild(chk);
    ul.appendChild(li);
  });
}

async function loadSummary() {
  const r = await fetch(`${API}/summary`);
  const s = await r.json();
  document.getElementById("stat-books").textContent = s.book_count;
  document.getElementById("stat-patterns").textContent = s.pattern_count;
  document.getElementById("stat-facts").textContent = s.fact_count;
  document.getElementById("stat-turns").textContent = s.dialogue_turns;
}

function selectedBooks() {
  const checks = document.querySelectorAll(".chk:checked");
  if (!checks.length) return null;
  return Array.from(checks).map(c => c.dataset.name);
}

const ALLOWED_INTENTS = new Set(["ask", "solve", "prove", "discover", "learn", "create", "general"]);

function makePill(text, extraClass) {
  const s = document.createElement("span");
  s.className = "pill" + (extraClass ? " " + extraClass : "");
  s.textContent = text;
  return s;
}

function appendMessage(role, text, meta) {
  const log = document.getElementById("chat-log");
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble" + (meta && meta.used_fallback ? " fallback" : "");
  bubble.textContent = text;
  div.appendChild(bubble);
  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    const intent = ALLOWED_INTENTS.has(meta.intent) ? meta.intent : "general";
    m.appendChild(makePill(intent, "intent-" + intent));
    if (meta.source_book) m.appendChild(makePill("📖 " + meta.source_book));
    if (meta.used_fallback) m.appendChild(makePill("no match", "fallback"));
    const confPct = typeof meta.confidence === "number" ? (meta.confidence * 100).toFixed(0) : "0";
    m.appendChild(makePill("conf " + confPct + "%"));
    div.appendChild(m);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function showTrace(meta) {
  // textContent is already XSS-safe; no innerHTML used.
  document.getElementById("trace").textContent = JSON.stringify(meta, null, 2);
}

function getApiKey() {
  return window.localStorage.getItem("nous_api_key") || "";
}

function apiHeaders(extra = {}) {
  const headers = Object.assign({"Content-Type": "application/json"}, extra);
  const key = getApiKey();
  if (key) headers["X-API-Key"] = key;
  return headers;
}

async function sendQuestion() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  appendMessage("user", text);

  const body = { text };
  const bks = selectedBooks();
  if (bks !== null) body.books = bks;

  const r = await fetch(`${API}/ask`, {
    method: "POST",
    headers: apiHeaders(),
    body: JSON.stringify(body),
  });
  const data = await r.json();
  appendMessage("ai", data.text, data);
  showTrace(data);
  loadSummary();
}

async function addBook() {
  const name = document.getElementById("new-name").value.trim();
  const raw = document.getElementById("new-content").value.trim();
  if (!name || !raw) { alert("name と JSON を入力してください"); return; }
  let content;
  try { content = JSON.parse(raw); }
  catch (e) { alert("JSON parse エラー: " + e.message); return; }
  const r = await fetch(`${API}/books`, {
    method: "POST",
    headers: apiHeaders(),
    body: JSON.stringify({ name, content }),
  });
  if (!r.ok) {
    alert("登録失敗: " + (await r.text()));
    return;
  }
  document.getElementById("new-name").value = "";
  document.getElementById("new-content").value = "";
  loadBooks();
  loadSummary();
}

async function clearChat() {
  await fetch(`${API}/conversation`, { method: "DELETE", headers: apiHeaders() });
  clearChildren(document.getElementById("chat-log"));
  loadSummary();
}

document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
});

loadBooks();
loadSummary();
</script>
</body>
</html>
